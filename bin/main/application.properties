# ===================================================================
# KGEC Campus Bus System - Application Configuration
# ===================================================================

spring.application.name=KGEC Campus Bus

# Server
server.port=${PORT:6767}

# Database configuration
# When deployed (e.g., on Render or Heroku), configure these environment variables
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/campusbus}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# H2 Console (disable in production by not setting it true)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Use 'update' so data persists between application restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Thymeleaf
spring.thymeleaf.cache=false

# Security - allow H2 console frames
spring.security.headers.frame=false
