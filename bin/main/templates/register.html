<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — KGEC Campus Bus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container auth-container">
            <div class="auth-card" id="register-card">
                <div class="auth-header">
                    <span class="auth-icon">📝</span>
                    <h1>Create Account</h1>
                    <p>Join the KGEC Campus Bus system</p>
                </div>

                <!-- Flash Messages -->
                <div th:if="${errorMsg}" class="alert alert-error" id="register-error">
                    <span th:text="${errorMsg}">Error</span>
                </div>

                <form th:action="@{/register}" method="post" class="auth-form" id="register-form">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g., Rahul Sharma" required/>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="e.g., rahul@kgec.edu.in" required/>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3"/>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6"/>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" required id="agree-terms"/>
                            I agree to the <a th:href="@{/terms}" target="_blank">Terms &amp; Conditions</a>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="register-submit-btn">Create Account</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
