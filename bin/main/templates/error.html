<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error — KGEC Campus Bus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container auth-container">
            <div class="auth-card" id="error-card">
                <div class="auth-header">
                    <span class="auth-icon">⚠️</span>
                    <h1>Oops! Something went wrong</h1>
                    <p th:text="${error != null ? error : 'An unexpected error occurred'}">Error</p>
                </div>
                <div class="auth-footer" style="margin-top: 2rem;">
                    <a th:href="@{/}" class="btn btn-primary">← Back to Home</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
