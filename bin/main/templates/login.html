<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — KGEC Campus Bus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container auth-container">
            <div class="auth-card" id="login-card">
                <div class="auth-header">
                    <span class="auth-icon">🔐</span>
                    <h1>Welcome Back</h1>
                    <p>Log in to book tickets and manage your rides</p>
                </div>

                <!-- Flash Messages -->
                <div th:if="${errorMsg}" class="alert alert-error" id="login-error">
                    <span th:text="${errorMsg}">Error</span>
                </div>
                <div th:if="${successMsg}" class="alert alert-success" id="login-success">
                    <span th:text="${successMsg}">Success</span>
                </div>

                <form th:action="@{/login}" method="post" class="auth-form" id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus/>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required/>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">Login</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
                </div>

                <div class="auth-demo-info">
                    <p><strong>Demo Accounts:</strong></p>
                    <p>Student: <code>student</code> / <code>student123</code></p>
                    <p>Admin: <code>admin</code> / <code>admin123</code></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
