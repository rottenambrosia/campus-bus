<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — KGEC Campus Bus' : 'KGEC Campus Bus System'}">KGEC Campus Bus</title>
    <meta name="description" th:content="${pageDescription != null ? pageDescription : 'Campus bus transportation system for Kalyani Government Engineering College. View schedules, book tickets, and track routes.'}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <th:block th:if="${extraHead}" th:utext="${extraHead}"></th:block>
</head>
<body>

    <!-- Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div th:replace="~{${view} :: content}"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-section">
                    <h3>🚌 KGEC Campus Bus</h3>
                    <p>Kalyani Government Engineering College<br/>Kalyani, Nadia, West Bengal — 741235</p>
                </div>
                <div class="footer-section">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a th:href="@{/schedule}">Schedule</a></li>
                        <li><a th:href="@{/map}">Route Map</a></li>
                        <li><a th:href="@{/booking}">Book Ticket</a></li>
                        <li><a th:href="@{/terms}">Terms &amp; Conditions</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Contact</h3>
                    <p>📧 transport@kgec.edu.in<br/>📞 +91-33-2582-1354</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 KGEC Campus Bus System. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script th:src="@{/js/booking.js}"></script>
</body>
</html>
