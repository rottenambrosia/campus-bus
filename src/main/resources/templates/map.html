<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Route Map — KGEC Campus Bus</title>
    <meta name="description" content="Interactive map showing all KGEC campus bus stops and routes around Kalyani."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        #map-container { width: 100%; height: 550px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        @media (max-width: 768px) { #map-container { height: 400px; } }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container page-container">
            <div class="page-header">
                <h1>🗺️ Route Map</h1>
                <p class="page-subtitle">Interactive map of all bus stops. Click markers for details.</p>
            </div>

            <div class="card" id="map-card">
                <div id="map-container"></div>
            </div>

            <!-- Stop Legend -->
            <div class="card" id="map-legend-card">
                <h2 class="card-title">Bus Stops</h2>
                <div class="legend-grid">
                    <div th:each="stop, iter : ${stops}" class="legend-item">
                        <span class="legend-marker" th:text="${iter.index + 1}">1</span>
                        <div>
                            <strong th:text="${stop.name}">Stop</strong>
                            <small th:text="'(' + ${stop.latitude} + ', ' + ${stop.longitude} + ')'">coords</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 KGEC Campus Bus System. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Pass stop data to JS -->
    <script th:inline="javascript">
        const busStops = /*[[${stops}]]*/ [];
    </script>
    <script th:src="@{/js/map.js}"></script>
</body>
</html>
